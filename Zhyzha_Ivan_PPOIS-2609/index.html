<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Орбита Луны вокруг Земли</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="scene" aria-label="Модель движения Луны вокруг Земли">
        <img class="earth" src="images/earth.png" alt="Планета Земля">

        <div class="orbit">
            <div class="orbit-plane">
                <div class="moon-holder">
                    <img
                        class="moon"
                        src="images/moon.png"
                        alt="Луна"
                    >
                </div>
            </div>
        </div>

    </main>
</body>
</html>
